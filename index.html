<body>

<!-- saringan untuk tepi kertas yang disobek -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="tepi-sobek" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.055" numOctaves="4" seed="9" result="derau"/>
      <feDisplacementMap in="SourceGraphic" in2="derau" scale="11"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<!-- layar memuat -->
<div id="memuat">
  <div class="memuat__isi">
    <div class="memuat__cincin"></div>
    <p class="memuat__teks">Sebentar, bunganya sedang mekar…</p>
    <div class="memuat__batang"><i></i></div>
    <span class="memuat__angka">0%</span>
  </div>
</div>

<p class="sudut-halaman" id="sudut"></p>

<main id="panggung"></main>

<div class="langkah" id="langkah" aria-hidden="true"></div>
